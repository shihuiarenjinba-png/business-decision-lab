name: External connectivity check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-account-a:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_A_ID }}
      CF_API_TOKEN: ${{ secrets.CF_ACCOUNT_A_API_TOKEN }}
    steps:
      - name: Verify Cloudflare account A
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID"
          test -n "$CF_API_TOKEN"
          response="$(curl -fsS             -H "Authorization: Bearer $CF_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID")"
          echo "$response" | jq -e --arg id "$CF_ACCOUNT_ID" '.success == true and .result.id == $id' >/dev/null
          echo "Cloudflare account A: authenticated and account ID matched."

  cloudflare-account-b:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_B_ID }}
      CF_API_TOKEN: ${{ secrets.CF_ACCOUNT_B_API_TOKEN }}
    steps:
      - name: Verify Cloudflare account B
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID"
          test -n "$CF_API_TOKEN"
          response="$(curl -fsS             -H "Authorization: Bearer $CF_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID")"
          echo "$response" | jq -e --arg id "$CF_ACCOUNT_ID" '.success == true and .result.id == $id' >/dev/null
          echo "Cloudflare account B: authenticated and account ID matched."

  stripe-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      STRIPE_ACCOUNT_ID: ${{ vars.STRIPE_ACCOUNT_ID }}
      STRIPE_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - name: Verify Stripe TEST key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRIPE_ACCOUNT_ID"
          test -n "$STRIPE_KEY"
          account="$(curl -fsS -u "$STRIPE_KEY:" https://api.stripe.com/v1/account)"
          echo "$account" | jq -e --arg id "$STRIPE_ACCOUNT_ID" '.id == $id' >/dev/null
          balance="$(curl -fsS -u "$STRIPE_KEY:" https://api.stripe.com/v1/balance)"
          echo "$balance" | jq -e '.livemode == false' >/dev/null
          echo "Stripe TEST: authenticated, account ID matched, livemode=false."

  stripe-live:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      STRIPE_ACCOUNT_ID: ${{ vars.STRIPE_ACCOUNT_ID }}
      STRIPE_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
    steps:
      - name: Verify Stripe LIVE key (read only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRIPE_ACCOUNT_ID"
          test -n "$STRIPE_KEY"
          account="$(curl -fsS -u "$STRIPE_KEY:" https://api.stripe.com/v1/account)"
          echo "$account" | jq -e --arg id "$STRIPE_ACCOUNT_ID" '.id == $id' >/dev/null
          balance="$(curl -fsS -u "$STRIPE_KEY:" https://api.stripe.com/v1/balance)"
          echo "$balance" | jq -e '.livemode == true' >/dev/null
          echo "Stripe LIVE: authenticated, account ID matched, livemode=true. No mutation performed."

  preview-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_A_ID }}
      CF_API_TOKEN: ${{ secrets.CF_ACCOUNT_A_API_TOKEN }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      PROJECT_NAME: business-decision-lab-preview
      PREVIEW_URL: https://preview.business-decision-lab-preview.pages.dev
      WEBHOOK_URL: https://preview.business-decision-lab-preview.pages.dev/api/stripe-webhook
    steps:
      - name: Verify Cloudflare Pages project
        shell: bash
        run: |
          set -euo pipefail
          project="$(curl -fsS             -H "Authorization: Bearer $CF_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT_NAME")"
          echo "$project" | jq -e --arg name "$PROJECT_NAME"             '.success == true and .result.name == $name' >/dev/null
          echo "Cloudflare Pages project: present."

      - name: Verify preview application and webhook endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PREVIEW_URL/" >/dev/null
          webhook="$(curl -fsS "$WEBHOOK_URL")"
          echo "$webhook" | jq -e             '.ok == true and .endpoint == "stripe-webhook" and .method == "POST"' >/dev/null
          echo "Preview application and webhook endpoint: reachable."

      - name: Verify Stripe TEST webhook registration
        shell: bash
        run: |
          set -euo pipefail
          endpoints="$(curl -fsS -u "$STRIPE_TEST_SECRET_KEY:"             "https://api.stripe.com/v1/webhook_endpoints?limit=100")"
          echo "$endpoints" | jq -e --arg url "$WEBHOOK_URL" '
            any(
              .data[]?;
              .url == $url
              and .status == "enabled"
              and (.enabled_events | index("checkout.session.completed")) != null
            )
          ' >/dev/null
          echo "Stripe TEST webhook: exact URL registered and enabled."
