name: Deploy Business Decision Lab preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "functions/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/deploy-preview.yml"
      - ".github/workflows/reusable-pages-preview.yml"

permissions:
  contents: read

concurrency:
  group: business-decision-lab-preview
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Require application checks to pass
        run: |
          set -euo pipefail
          npm test
          npm run check
          test -f public/index.html

  deploy:
    needs: verify
    uses: ./.github/workflows/reusable-pages-preview.yml
    with:
      project_name: business-decision-lab-preview
      public_dir: public
      cloudflare_account_id: ${{ vars.CF_ACCOUNT_A_ID }}
    secrets:
      cloudflare_api_token: ${{ secrets.CF_ACCOUNT_A_API_TOKEN }}
