name: Deploy Business Decision Lab preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "functions/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/deploy-preview.yml"

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_A_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ACCOUNT_A_API_TOKEN }}
      PROJECT_NAME: business-decision-lab-preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify project files
        run: |
          set -euo pipefail
          npm test
          npm run check
          test -f public/index.html

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          http="$(curl -sS -o /tmp/project.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME")"

          if [ "$http" = "200" ]; then
            echo "Pages project already exists."
          elif [ "$http" = "404" ]; then
            echo "Creating Pages project."
            curl -fsS -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data "{\"name\":\"$PROJECT_NAME\",\"production_branch\":\"main\"}"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"               | jq -e '.success == true' >/dev/null
          else
            echo "Unexpected Pages lookup HTTP status: $http"
            jq -c '{success,errors}' /tmp/project.json || true
            exit 1
          fi

      - name: Deploy preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy public             --project-name "$PROJECT_NAME"             --branch preview             --commit-hash "$GITHUB_SHA"
