<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Business Decision Lab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div><strong>Business Decision Lab</strong><span class="badge">LOCAL FIRST</span></div>
    <span class="muted">受注・Relevant Cost・Capacity判断</span>
  </header>
  <main class="layout">
    <section class="panel">
      <h1>企業の現在地</h1>
      <p class="lead">売上を従業員だけの成果とはみなさず、変動費・労務固定費・減価償却・占有費などを分離して企業全体を評価します。</p>
      <form id="companyForm" class="grid">
        <label>月間売上<input id="monthlyRevenue" type="number" min="0" value="5000000"></label>
        <label>変動費<input id="variableCosts" type="number" min="0" value="3000000"></label>
        <label>固定労務費<input id="fixedLaborCost" type="number" min="0" value="900000"></label>
        <label>減価償却<input id="depreciation" type="number" min="0" value="250000"></label>
        <label>家賃・占有費<input id="occupancyCost" type="number" min="0" value="200000"></label>
        <label>その他固定営業費<input id="otherFixedOperatingCosts" type="number" min="0" value="150000"></label>
        <label>従業員数<input id="employeeCount" type="number" min="0" step="1" value="7"></label>
        <label>1人あたり月間稼働可能時間<input id="paidHoursPerEmployee" type="number" min="0" value="160"></label>
        <label>労働 capacity<input id="laborCapacity" type="number" min="0" value="1120"></label>
        <label>労働 使用時間<input id="laborUsed" type="number" min="0" value="780"></label>
        <label>設備 capacity<input id="machineCapacity" type="number" min="0" value="180"></label>
        <label>設備 使用時間<input id="machineUsed" type="number" min="0" value="150"></label>
      </form>
      <div id="baselineCards" class="cards"></div>
      <p class="note">「労働時間あたり残余」は従業員の因果的な価値ではありません。変動費と明示的な非労務固定費を差し引いた後、労働capacityで割った企業診断用の代理指標です。</p>
    </section>

    <section class="panel">
      <h2>新規受注を評価</h2>
      <form id="orderForm" class="grid">
        <label>案件名<input id="orderName" value="Order A"></label>
        <label>受注売上<input id="orderRevenue" type="number" min="0" value="1000000"></label>
        <label>数量<input id="orderUnits" type="number" min="0" value="100"></label>
        <label>材料費<input id="materials" type="number" min="0" value="500000"></label>
        <label>追加労務費<input id="incrementalLabor" type="number" min="0" value="100000"></label>
        <label>追加設備費<input id="incrementalEquipment" type="number" min="0" value="0"></label>
        <label>外注費<input id="external" type="number" min="0" value="0"></label>
        <label>その他Relevant Cost<input id="otherRelevantCost" type="number" min="0" value="0"></label>
        <label>Step-fixed cost<input id="stepFixedCost" type="number" min="0" value="0"></label>
        <label>既知の機会費用<input id="knownOpportunityCost" type="number" min="0" value="0"></label>
        <label>必要労働時間<input id="orderLaborHours" type="number" min="0" value="60"></label>
        <label>必要設備時間<input id="orderMachineHours" type="number" min="0" value="10"></label>
      </form>
      <div class="actions">
        <button id="evaluate" type="button">判断する</button>
        <button id="saveProfile" class="secondary" type="button">企業設定を端末保存</button>
        <button id="exportJson" class="secondary" type="button">結果JSON</button>
      </div>
      <div id="decisionBanner" class="decision"></div>
      <div id="orderCards" class="cards"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Resource</th><th>Before</th><th>追加</th><th>After</th><th>利用率</th><th>判定</th></tr></thead>
          <tbody id="resourceRows"></tbody>
        </table>
      </div>
      <details>
        <summary>計算上の仮定</summary>
        <ul id="assumptions"></ul>
      </details>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
